name: BlueBuild

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  upstream:
    name: Check FCOS base image
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      rebuild: ${{ steps.decision.outputs.rebuild }}
    steps:
      - name: Always build repository-triggered runs
        id: immediate
        if: github.event_name != 'schedule'
        run: echo 'rebuild=true' >> "${GITHUB_OUTPUT}"

      - name: Compare scheduled FCOS base digests
        id: compare
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

          upstream_digest=$(skopeo inspect --override-arch amd64 \
            --format '{{ .Digest }}' \
            docker://quay.io/fedora/fedora-coreos:stable)
          owner=${OWNER,,}
          downstream_ref="docker://ghcr.io/${owner}/luebeck:stable"
          if downstream_base_digest=$(skopeo inspect --override-arch amd64 \
            --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
            --format '{{ index .Labels "org.opencontainers.image.base.digest" }}' \
            "${downstream_ref}" 2>/dev/null); then
            :
          else
            downstream_base_digest=
          fi

          if [[ -z "${upstream_digest}" ]]; then
            echo 'FCOS base image has no manifest digest.' >&2
            exit 1
          fi
          if [[ "${upstream_digest}" == "${downstream_base_digest}" ]]; then
            echo "FCOS base ${upstream_digest} is already published; skipping rebuild."
            echo 'rebuild=false' >> "${GITHUB_OUTPUT}"
          else
            echo "FCOS base changed: ${downstream_base_digest:-missing} -> ${upstream_digest}."
            echo 'rebuild=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Export build decision
        id: decision
        env:
          IMMEDIATE: ${{ steps.immediate.outputs.rebuild }}
          SCHEDULED: ${{ steps.compare.outputs.rebuild }}
        run: echo "rebuild=${IMMEDIATE:-${SCHEDULED}}" >> "${GITHUB_OUTPUT}"

  image:
    name: Build ${{ matrix.recipe }}
    needs: upstream
    if: needs.upstream.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - luebeck.yml
    steps:
      - name: Build and publish image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
