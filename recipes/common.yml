---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - btrfs-progs
        - firewalld
        - tmux
        - fish
        - htop
        - ranger

  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      enabled:
        - firewalld.service
