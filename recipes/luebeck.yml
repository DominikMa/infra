---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: luebeck
description: Declarative Fedora CoreOS image for luebeck
base-image: quay.io/fedora/fedora-coreos
image-version: stable
platforms:
  - linux/amd64
modules:
  - from-file: common.yml

  - type: files
    files:
      - source: luebeck
        destination: /

  - type: script
    scripts:
      - configure-luebeck-subids.sh

  - type: systemd
    system:
      enabled:
        - service-data.service

  - type: signing
