---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: luebeck
description: Declarative Fedora CoreOS image for luebeck
base-image: quay.io/fedora/fedora-coreos
image-version: stable
alt-tags:
  - stable
platforms:
  - linux/amd64
modules:
  - from-file: common.yml

  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - tailscale

  - type: files
    files:
      - source: luebeck
        destination: /

  - type: script
    scripts:
      - configure-luebeck-config-ownership.sh

  - type: systemd
    system:
      enabled:
        - service-data.service
        - tailscaled.service
        - image-update.timer
      masked:
        - zincati.service

  - type: signing
