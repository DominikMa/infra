# Knotenidentitaet auf der bei Neuinstallationen erhaltenen Datenpartition.
[Unit]
RequiresMountsFor=/var/lib/service-data/tailscale
After=systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/var/lib/service-data/tailscale/tailscaled.state --statedir=/var/lib/service-data/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
